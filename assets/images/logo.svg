<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand Emblem Mark -->
  <g transform="translate(10, 10)">
    <!-- Base Shield / Rounded Background -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#primaryGrad)" filter="url(#glow)"/>
    
    <!-- Medical Cross with Rounded Ends -->
    <rect x="39" y="20" width="22" height="60" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="20" y="39" width="60" height="22" rx="6" fill="#FFFFFF" opacity="0.95"/>

    <!-- Dynamic Heartbeat / ECG Wave across Cross -->
    <path d="M 22 50 L 36 50 L 42 32 L 50 68 L 58 44 L 64 50 L 78 50" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Accent Spark / Star -->
    <circle cx="78" cy="24" r="5" fill="#F59E0B" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- Primary Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="#0A2540">
      M/S JAMEEL <tspan fill="#0284C7">SONS</tspan>
    </text>

    <!-- Category Subtitle -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3" fill="#64748B">
      HEALTHCARE &amp; MEDICAL SUPPLY SOLUTIONS
    </text>

    <!-- Bottom Accent Line -->
    <rect x="2" y="80" width="60" height="3.5" rx="1.75" fill="#0284C7" />
    <rect x="68" y="80" width="24" height="3.5" rx="1.75" fill="#F59E0B" />
    <rect x="98" y="80" width="12" height="3.5" rx="1.75" fill="#0D9488" />
  </g>
</svg>
